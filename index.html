<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Chalkline: ideas to diagrams." />
    <title>Chalkline</title>
    <script>
      // Apply the theme before first paint to avoid a flash. Mirrors storedPreference in src/lib/theme.ts.
      ;(function () {
        var pref = 'system'
        try {
          var settings = localStorage.getItem('chalkline.settings')
          if (settings === null) pref = localStorage.getItem('chalkline.theme') || 'system'
          else pref = ((JSON.parse(settings) || {}).appearance || {}).theme || 'system'
        } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
